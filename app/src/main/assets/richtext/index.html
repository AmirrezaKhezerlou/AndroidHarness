<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<link rel="stylesheet" href="katex/katex.min.css">
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    color: #e6e6e6;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  #root {
    display: inline-block;
    white-space: nowrap;
    padding: 1px 0;
  }
  #root.display {
    display: block;
    white-space: normal;
    text-align: center;
    padding: 4px 0;
  }
  #root.diagram {
    display: block;
    text-align: center;
    padding: 4px 0;
    overflow-x: auto;
  }
  .katex-display {
    margin: 0;
  }
  .katex {
    font-size: 1.05em;
  }
  .diagram svg {
    max-width: 100%;
    height: auto;
  }
  .render-error {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 0.9em;
    color: #ff8a80;
    white-space: pre-wrap;
  }
</style>
</head>
<body>
<div id="root"></div>
<script>
  // Mermaid 10 uses structuredClone; older WebViews do not expose it.
  if (!window.structuredClone) {
    window.structuredClone = function (value) {
      return JSON.parse(JSON.stringify(value));
    };
  }
</script>
<script src="katex/katex.min.js"></script>
<script>
  function report() {
    const root = document.getElementById('root');
    const rect = root.getBoundingClientRect();
    const width = Math.max(1, Math.ceil(rect.width));
    const height = Math.max(1, Math.ceil(root.scrollHeight || rect.height));
    document.title = 'render:' + width + ':' + height;
  }

  function renderMath(tex, displayMode, color) {
    const root = document.getElementById('root');
    root.className = displayMode ? 'display' : '';
    root.style.color = color || 'inherit';
    try {
      katex.render(tex, root, {
        displayMode: !!displayMode,
        throwOnError: false,
        trust: false,
        strict: false,
        output: 'html'
      });
    } catch (e) {
      root.className = 'display';
      root.innerHTML = '<span class="render-error"></span>';
      root.firstChild.textContent = tex;
    }
    report();
  }

  // Math answers may contain many equation views. Loading the 3 MB diagram
  // library in each of them needlessly repeated parsing and retained JS heaps.
  let mermaidLoader;
  function loadMermaid() {
    if (!mermaidLoader) {
      mermaidLoader = new Promise(function (resolve, reject) {
        const script = document.createElement('script');
        script.src = 'mermaid/mermaid.min.js';
        script.onload = resolve;
        script.onerror = reject;
        document.head.appendChild(script);
      });
    }
    return mermaidLoader;
  }

  function renderMermaid(code, dark) {
    const root = document.getElementById('root');
    root.className = 'diagram';
    loadMermaid().then(function () {
      mermaid.initialize({
        startOnLoad: false,
        securityLevel: 'strict',
        theme: dark ? 'dark' : 'default',
        fontFamily: '-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif',
        flowchart: { htmlLabels: false }
      });
      return mermaid.render('harness-diagram', code);
    }).then(function (result) {
      root.innerHTML = result.svg;
      report();
    }).catch(function () {
      root.textContent = 'Diagram error';
      report();
    });
  }

</script>
</body>
</html>
